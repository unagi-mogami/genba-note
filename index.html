<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>現場ノート</title>
<meta name="theme-color" content="#3b2414">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="現場ノート">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Shippori+Mincho+B1:wght@800&display=swap">
<style>
/* 片手・濡れた手でも押せる大きめの1列レイアウト。下に5つのタブ */
:root{
  --bg:#f3f1ec; --surface:#fff; --sunk:#e9e5dc; --line:#d8d2c5;
  --fg:#1f1a14; --muted:#6b6256;
  --tare:#5a3218; --tare-soft:#f1e4d6;
  --accent:#3d5a1f; --accent-fg:#fff; --accent-soft:#e3ead6;
  --danger:#b3261e; --danger-soft:#f8e2df;
  --warn:#8a5a00; --warn-soft:#fbefd2;
  --ok:#2f6b3a; --ok-soft:#dcefdc;
  --f-display:"Shippori Mincho B1","Hiragino Mincho ProN",serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --r:14px; --nav-h:64px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141210; --surface:#1e1b17; --sunk:#27231e; --line:#3a342c;
  --fg:#efe9df; --muted:#a99f91;
  --tare:#e0ac82; --tare-soft:#33261b;
  --accent:#a3c770; --accent-fg:#14180f; --accent-soft:#28331c;
  --danger:#ff8a80; --danger-soft:#3a1e1b;
  --warn:#f0c062; --warn-soft:#352a12;
  --ok:#8fd19a; --ok-soft:#1d3220; color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.6;
  padding:env(safe-area-inset-top) max(16px,env(safe-area-inset-right)) calc(var(--nav-h) + env(safe-area-inset-bottom) + 24px) max(16px,env(safe-area-inset-left))}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:14px}
.brand small{display:block;font-size:11px;letter-spacing:.2em;color:var(--muted)}
.brand h1{margin:0;font-family:var(--f-display);font-size:26px;line-height:1.2;color:var(--tare)}
.who{font-size:14px;color:var(--muted);text-align:right}
.who b{color:var(--fg);font-size:16px}
h2{margin:4px 0 0;font-size:19px;font-weight:900}
h3{margin:0;font-size:13px;letter-spacing:.12em;color:var(--muted);font-weight:700}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:13px}
input,select,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;min-height:48px;width:100%;min-width:0}
textarea{min-height:72px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.btn{font:inherit;font-weight:700;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);padding:10px 16px;min-height:48px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-size:17px;min-height:56px}
.btn.tare{background:var(--tare);border-color:var(--tare);color:#fff}
@media (prefers-color-scheme:dark){.btn.tare{color:#1e1b17}}
.btn.ghost{background:transparent}
.btn.danger{border-color:var(--danger);color:var(--danger);background:transparent}
.btn.small{min-height:40px;padding:6px 12px;font-size:14px;border-radius:10px}
.btn.wide{width:100%}
.btn:disabled{opacity:.5}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.banner{border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.banner.info{background:var(--sunk);color:var(--muted)}
.banner.ok{background:var(--ok-soft);color:var(--ok)}
.banner b{font-size:15px}
.list{display:flex;flex-direction:column;gap:10px}
.item{background:var(--surface);border:1px solid var(--line);border-left-width:6px;border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.item.late{border-left-color:var(--danger)} .item.soon{border-left-color:var(--warn)}
.item.okc{border-left-color:var(--ok)} .item.idle{border-left-color:var(--line)}
.item.mine{box-shadow:0 0 0 2px var(--tare-soft)}
.head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.title{font-weight:700;font-size:17px;overflow-wrap:anywhere;min-width:0}
.meta{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 12px}
.pill{font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px;white-space:nowrap}
.pill.late{background:var(--danger-soft);color:var(--danger)} .pill.soon{background:var(--warn-soft);color:var(--warn)}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.idle{background:var(--sunk);color:var(--muted)}
.pill.tare{background:var(--tare-soft);color:var(--tare)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions .btn{flex:1 1 auto}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{font:inherit;font-size:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:6px 14px;min-height:40px;cursor:pointer}
.seg button[aria-pressed=true]{border-color:var(--fg);color:var(--fg);font-weight:700;background:var(--sunk)}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:20px;color:var(--muted);text-align:center;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column}
.stat b{font-size:26px;line-height:1.2;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.stat.alert{border-color:var(--danger);background:var(--danger-soft)} .stat.alert b{color:var(--danger)}
.photo{width:100%;max-height:260px;object-fit:cover;border-radius:10px;background:var(--sunk);display:block}
.thumb{width:72px;height:72px;object-fit:cover;border-radius:10px;background:var(--sunk);flex:none}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>label,.field>.lab{font-size:13px;font-weight:700;color:var(--muted)}
.err{color:var(--danger);font-weight:700;font-size:14px}
details summary{cursor:pointer;font-weight:700;color:var(--muted);padding:6px 0}
.big-pick{display:flex;align-items:center;gap:14px;background:var(--tare);color:#fff;border-radius:var(--r);padding:16px;border:0;font:inherit;text-align:left;cursor:pointer;width:100%}
@media (prefers-color-scheme:dark){.big-pick{color:#1e1b17}}
.big-pick .em{font-size:34px;line-height:1}
.big-pick b{font-size:18px;display:block}
.big-pick span{font-size:13px;opacity:.85}
.rank{display:flex;align-items:center;gap:12px}
.rank .no{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:900;background:var(--sunk);flex:none}
.rank.top .no{background:var(--tare);color:#fff}
.rank .nm{font-weight:700;flex:1;min-width:0}
.rank .pt{font-size:22px;font-weight:900;font-variant-numeric:tabular-nums}
.stamps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stampbtn{border:0;border-radius:18px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font:inherit;font-weight:900;font-size:13px;cursor:pointer;color:#2a1a0c;min-height:84px;justify-content:center}
.stampbtn .em{font-size:32px;line-height:1.1}
.stampbtn[aria-pressed=true]{outline:3px solid var(--fg);outline-offset:2px}
.got{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 10px 2px 6px;font-size:12px;font-weight:700;color:#2a1a0c}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);border-radius:999px;padding:6px 12px;font:inherit;font-size:14px;background:var(--surface);color:var(--fg);cursor:pointer;min-height:40px}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:700}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:4px max(4px,env(safe-area-inset-right)) env(safe-area-inset-bottom) max(4px,env(safe-area-inset-left));z-index:20}
nav.tabs button{border:0;background:transparent;font:inherit;font-size:11px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:0;padding:6px 0;min-height:var(--nav-h);position:relative;cursor:pointer}
nav.tabs button .ic{font-size:22px;line-height:1.3}
nav.tabs button[aria-selected=true]{color:var(--tare)}
nav.tabs .dot{position:absolute;top:4px;right:calc(50% - 22px);min-width:18px;height:18px;border-radius:9px;background:var(--danger);color:#fff;font-size:11px;display:grid;place-items:center;padding:0 5px}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
.sheet .bar{display:flex;justify-content:space-between;align-items:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 14px);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;font-size:14px;z-index:60;max-width:90vw;text-align:center}
.center{min-height:70vh;display:flex;flex-direction:column;justify-content:center;gap:16px}
.namebtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.namebtns .btn{min-height:56px;font-size:17px}
table.mini{width:100%;border-collapse:collapse;font-size:14px}
table.mini td{padding:8px 4px;border-bottom:1px solid var(--line);vertical-align:middle}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--tare);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="center"><div class="spin"></div><p class="muted" style="text-align:center">読み込み中…</p></div></div>
<nav class="tabs" id="tabs" role="tablist" hidden>
  <button role="tab" data-tab="task"><span class="ic">📝</span>やること<span class="dot" hidden></span></button>
  <button role="tab" data-tab="clean"><span class="ic">🧹</span>掃除<span class="dot" hidden></span></button>
  <button role="tab" data-tab="notice"><span class="ic">📢</span>連絡<span class="dot" hidden></span></button>
  <button role="tab" data-tab="point"><span class="ic">⭐</span>ポイント<span class="dot" hidden></span></button>
  <button role="tab" data-tab="set"><span class="ic">⚙️</span>設定<span class="dot" hidden></span></button>
</nav>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
